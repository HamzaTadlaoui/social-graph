# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Skips the configuration phase entirely when nothing affecting it has changed.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# KSP, which Room's compiler runs on, registers its generated sources through the
# kotlin.sourceSets DSL, and AGP 9's built-in Kotlin refuses that by default.
# See https://developer.android.com/r/tools/built-in-kotlin.
android.disallowKotlinSourceSets=false
